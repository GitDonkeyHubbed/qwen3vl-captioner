[project]
name = "qwen3vl-captioner"
version = "1.4.3"
description = "Portable Qwen3-VL image captioning GUI with GGUF inference"
# <3.13 because the pinned llama-cpp-python fork wheels are cp312-only
requires-python = ">=3.11,<3.13"
dependencies = [
    # PyPI floor is for API compatibility only — GGUF Qwen3-VL captioning
    # needs JamePeng's fork wheels, installed by setup.bat / setup.sh
    "llama-cpp-python>=0.3.0",
    "PyQt6>=6.7",
    "Pillow>=12.2.0",
    "huggingface-hub>=0.32",
    "hf_xet>=1.0",
    "numpy>=1.26",
    "nvidia-ml-py>=12.0",
    "psutil>=5.9",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# MLX backend for Apple Silicon Macs (installed automatically by setup.sh)
mlx = ["mlx-vlm>=0.6"]

[project.scripts]
qwen3vl-captioner = "app:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# Explicit discovery: with app.py/doctor.py at the root next to two packages,
# setuptools' flat-layout auto-detection refuses to build ("multiple top-level
# packages"), which silently broke `pip install .` and the console script.
[tool.setuptools]
packages = ["engine", "gui"]
py-modules = ["app", "doctor"]

[tool.setuptools.package-data]
gui = ["*.png"]

[tool.ruff]
# Ruff replaces pyflakes in CI (see .github/workflows/lint.yml). Rule groups
# are enabled only once the codebase is clean under them, so CI never goes red
# on a lint upgrade. Candidates to grow into (run `ruff check --select <X>` to
# see the work involved): I (import order), UP (modern syntax), SIM, PERF, S.
target-version = "py311"
extend-exclude = ["build", "qwen3vl_captioner.egg-info"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (imports, statements, syntax)
    "F",               # pyflakes — the previous CI linter, 1:1
    "B",               # bugbear — likely bugs (mutable defaults, bare raise-in-except…)
    "PLE",             # pylint errors
]

[tool.ruff.lint.per-file-ignores]
# app.py must initialise the GPU runtime (setup_cuda_dll_path, llama.cpp
# backend) BEFORE importing PyQt6 — see the comment block in app.py — so its
# late imports are deliberate, not an oversight.
"app.py" = ["E402"]
