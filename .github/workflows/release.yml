name: Release

# Pushing a version tag (e.g. V1.4.3) publishes the GitHub release — but
# only after proving the tag matches every in-repo statement of the
# version (gui/version.py, pyproject.toml, README title + badge, newest
# CHANGELOG entry). The v1.4.2 release shipped with the in-app version
# still reading 1.4.1; this gate makes that class of mismatch impossible
# to release again. Release notes are extracted from CHANGELOG.md.

on:
  push:
    tags: ["V*.*.*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (e.g. V1.4.3) — must match the in-repo version"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GitHub redirects releases/latest/download/<this name> to the file of
      # that name on the newest published release, which gives the README's
      # download button a link that only ever serves released code. Never
      # rename it: once the button points there, every release must carry
      # exactly this file or the button 404s.
      DOWNLOAD_ZIP: QWEN3-VL-Captioner.zip
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate the tag name
        env:
          # github.event.inputs is safe to reference on every event type;
          # the bare `inputs` context is not defined for tag-push runs.
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # Strict shape check before the value goes anywhere (GITHUB_ENV,
          # git, gh): rejects option-like names, newlines, and junk tags.
          if [[ ! "$TAG" =~ ^[Vv][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a V<major>.<minor>.<patch> version tag"
            exit 1
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Verify tag matches every in-repo version
        run: |
          python3 - "$TAG_NAME" <<'EOF'
          import re, sys, tomllib

          tag = sys.argv[1].lstrip("Vv")
          # Accept either quote style, matching tests/test_version_sync.py.
          # The two patterns disagreeing meant a quoting change passed CI and
          # then crashed this job with an AttributeError on None.
          app_match = re.search(
              r"""APP_VERSION\s*=\s*['"]([^'"]+)['"]""", open("gui/version.py").read()
          )
          if app_match is None:
              sys.exit("APP_VERSION not found in gui/version.py")
          app = app_match.group(1)
          proj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          readme = open("README.md").read()
          badge = re.search(
              r"img\.shields\.io/badge/version-([\d.]+)-", readme
          ).group(1)
          newest = re.search(
              r"^## \[([\d.]+)\]", open("CHANGELOG.md").read(), re.M
          ).group(1)

          rows = {
              "git tag": tag,
              "gui/version.py": app,
              "pyproject.toml": proj,
              "README badge": badge,
              "CHANGELOG newest": newest,
          }
          for name, value in rows.items():
              print(f"  {name:18} {value}")
          # Check the <h1> specifically — "V<tag>" appears in What's New
          # headings too, which would mask a stale title.
          title = re.search(r"<h1[^>]*>([^<]*)</h1>", readme)
          title_ok = bool(title) and f"V{tag}" in title.group(1)
          print(f"  {'README <h1> title':18} {title.group(1).strip() if title else 'NOT FOUND'}")

          if len(set(rows.values())) != 1 or not title_ok:
              # Workflow commands are parsed from stdout; a sys.exit message
              # goes to stderr and the annotation would be lost.
              print(
                  "::error::Version mismatch — refusing to publish. "
                  "Sync every location above to the tag, re-tag, and push again."
              )
              sys.exit(1)
          print("All version statements agree — publishing.")
          EOF

      - name: Extract this version's CHANGELOG section as release notes
        run: |
          python3 - <<'EOF'
          import re

          text = open("CHANGELOG.md").read()
          m = re.search(r"^## \[[\d.]+\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          notes = m.group(1).strip() + "\n"
          open("RELEASE_NOTES.md", "w").write(notes)
          print(notes)
          EOF

      - name: Create and push the tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -- "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Build the one-click download ZIP from the tagged commit
        # HEAD is the tagged commit on both paths: a tag push checks the tag
        # out, and manual dispatch has just tagged HEAD above. The folder
        # inside carries the version, like GitHub's own source archive.
        run: |
          VERSION="${TAG_NAME#[Vv]}"
          git archive --format=zip --prefix="qwen3vl-captioner-${VERSION}/" \
            -o "$DOWNLOAD_ZIP" HEAD
          python3 - "$DOWNLOAD_ZIP" "qwen3vl-captioner-${VERSION}/" <<'EOF'
          import sys, zipfile

          path, root = sys.argv[1], sys.argv[2]
          names = set(zipfile.ZipFile(path).namelist())
          needed = ["setup.bat", "setup.sh", "run.bat", "run.sh", "app.py"]
          missing = [n for n in needed if root + n not in names]
          if missing:
              print(f"::error::{path} is missing {missing} under {root}")
              sys.exit(1)
          print(f"{path}: {len(names)} entries under {root}")
          EOF

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # gh creates the release as a draft, uploads the ZIP, and publishes
        # only after the upload succeeds (deleting the draft if it fails),
        # so a published — immutable — release never lacks the button's file.
        run: |
          gh release create "$TAG_NAME" \
            --title "Qwen3-VL Captioner $TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "$DOWNLOAD_ZIP"

      - name: Confirm the fixed-name download URL now serves this release
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${DOWNLOAD_ZIP}"
          for attempt in 1 2 3 4 5 6; do
            loc=$(curl -sI "$URL" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2; exit}')
            if [[ "$loc" == */releases/download/"${TAG_NAME}"/"${DOWNLOAD_ZIP}" ]] \
                && curl -sfIL -o /dev/null "$URL"; then
              echo "releases/latest/download/${DOWNLOAD_ZIP} serves ${TAG_NAME}: ${loc}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::releases/latest/download/${DOWNLOAD_ZIP} does not serve ${TAG_NAME} (it redirects to '${loc}'). Check that this release is marked Latest."
          exit 1
