name: PR Checks

# Pull-request-only gates that run alongside the existing CI:
#   - Require test plan fails the check unless the PR body contains a
#     "## Test plan" heading. It reads the event payload only — no checkout,
#     no third-party actions, no token — and re-runs on `edited` so fixing
#     the description turns it green without a new commit. To block merging
#     on it, add "Require test plan" as a required status check in a branch
#     ruleset.
#
# Bot-authored pull requests are exempt. Dependabot (and GitHub's other
# bots) generate their descriptions from a fixed template -- release notes,
# a commit list, a compatibility badge, the @dependabot command list -- and
# have no way to add a heading to it, so the gate was asking them for
# something they cannot produce and failed every bot PR. The exemption sits
# on the step rather than the job so the job still reports success and keeps
# satisfying the required status check.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  require-test-plan:
    # This job name is the status-check name GitHub shows; keep it stable so
    # rulesets that require it keep matching.
    name: Require test plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require PR Test Plan
        # Bots cannot edit their own generated descriptions; see the note
        # at the top of this file. Two independent signals, so the exemption
        # does not hinge on either one alone: `user.type` is set by GitHub
        # from the account that opened the PR, and the `[bot]` login suffix
        # is reserved for App accounts (GitHub rejects `[` in a username, so
        # no human can hold such a login). Both come from the account, not
        # from anything the PR body carries.
        if: >-
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        # The body is passed through env (never interpolated into the script)
        # so PR text cannot inject shell.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$PR_BODY" | grep -Eiq '^[[:space:]]*#{1,6}[[:space:]]+test[[:space:]]*plan[[:space:]]*$'; then
            echo "Found a 'Test plan' heading in the PR description."
          else
            echo "::error::PR description must contain a '## Test plan' heading."
            exit 1
          fi
